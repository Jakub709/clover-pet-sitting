# Netlify configuration for cloverpetsitting.com
# Static site, no build step needed — deploy this whole folder as-is.

# Redirect the .co.uk domain to the primary .com domain
[[redirects]]
  from = "https://cloverpetsitting.co.uk/*"
  to = "https://cloverpetsitting.com/:splat"
  status = 301
  force = true

# Clean URL for the Terms & Conditions page (/terms instead of /terms.html)
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Canonical root — redirect the .html filename to "/"
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
