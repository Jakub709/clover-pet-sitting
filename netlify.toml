# Netlify configuration for cloverpetsit.com
# Static site, no build step needed — deploy this whole folder as-is.

# Older domains (bought at Fasthosts) → primary domain cloverpetsit.com.
# These rules take effect once their DNS points to Netlify and they are
# added under Domain management.
[[redirects]]
  from = "https://cloverpetsitting.com/*"
  to = "https://cloverpetsit.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://cloverpetsitting.co.uk/*"
  to = "https://cloverpetsit.com/:splat"
  status = 301
  force = true

# Clean URL for the Terms & Conditions page (/terms instead of /terms.html)
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Canonical root — redirect the .html filename to "/"
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
